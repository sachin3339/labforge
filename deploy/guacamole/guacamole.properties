# LabForge Guacamole config.
#
# File-based authentication. The control-plane is the SOLE writer of
# user-mapping.xml in this directory; Guacamole re-reads the file on
# every login, so no restart is needed when a lab is provisioned or
# torn down.
#
# Reference: https://guacamole.apache.org/doc/gug/configuring-guacamole.html
# The built-in BasicFileAuthenticationProvider is loaded automatically
# whenever GUACAMOLE_HOME contains a user-mapping.xml — no auth-provider
# declaration is needed (and adding the wrong class name will break
# startup).

# guacd (the protocol daemon) — same docker-compose network.
guacd-hostname: guacd
guacd-port:     4822

# At boot, the official entrypoint copies GUACAMOLE_HOME (= /etc/guacamole,
# our bind-mount) into ~/.guacamole, so Tomcat's runtime config is a frozen
# snapshot. Point the file-auth provider back at the LIVE bind-mount so
# control-plane edits to user-mapping.xml are picked up automatically (the
# provider re-reads on mtime change).
basic-user-mapping: /etc/guacamole/user-mapping.xml

