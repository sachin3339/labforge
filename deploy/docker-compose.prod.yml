# LabForge production stack — single OVH box.
#
# Run on the OVH Mumbai box (148.113.1.66):
#   cd /opt/labforge
#   cp deploy/.env.prod.example deploy/.env.prod
#   # edit deploy/.env.prod: paste CLOUDFLARE_API_TOKEN, JWT keys, tenant key
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
#
# DNS prerequisites (Cloudflare, grey-cloud / proxied=OFF):
#   A   admin.environments       148.113.1.66
#   A   api.environments         148.113.1.66
#   A   *.lab.environments       148.113.1.66
#
# Stack:
#   caddy        80/443  — wildcard TLS via Cloudflare DNS-01, reverse proxy
#   admin-ui     4100    — Next.js admin console
#   control-plane 4000   — Fastify API + wildcard lab subdomain proxy
#   postgres     5432    — Prisma DB
#   redis        6379    — queue + cache
services:
  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Lab containers on the `local` node bind their published ports to the
    # host loopback (127.0.0.1:hostPort). From inside the caddy container
    # `127.0.0.1` means caddy itself, so we expose the host's loopback via
    # `host.docker.internal`. The `host-gateway` magic resolves to the
    # Docker bridge gateway on the host, which can reach 127.0.0.1 bindings.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - admin-ui
      - control-plane
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labforge}
      POSTGRES_DB: labforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labforge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Apache Guacamole RDP gateway. Two-container layout per upstream's
  # recommended deploy:
  #   guacd        — the protocol daemon (RDP/VNC/SSH) on tcp/4822
  #   guacamole    — the HTML5 client web app on tcp/8080
  # The control-plane writes user-mapping.xml into ./guacamole/, which is
  # bind-mounted at /etc/guacamole inside the guacamole container. File
  # auth re-reads on every login, so no service restart is needed when
  # connections are added/removed.
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    networks:
      - default

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # The official start.sh has two non-negotiable side effects at boot:
      #   1. `rm -Rf ~/.guacamole` (line 1045) — blows away the runtime
      #      config dir. ANY bind-mount underneath this path causes EACCES
      #      and an infinite restart loop, so we must NOT mount there.
      #   2. `cp -a $GUACAMOLE_HOME/. ~/.guacamole/` — copies our template
      #      into the freshly-wiped runtime dir. The auth provider then
      #      reads ~/.guacamole/user-mapping.xml at every login (it polls
      #      mtime, so live edits to the file it points to ARE picked up).
      #
      # Trick: after start.sh finishes setup, replace the copied
      # user-mapping.xml with a SYMLINK that points INTO the directory
      # bind-mount /etc/guacamole. We deliberately use the DIRECTORY mount
      # (not a single-file mount) because control-plane does atomic
      # writes (tempfile + rename), which creates a fresh inode each
      # time. Single-file bind-mounts are pinned to the inode that
      # existed at container start, so the container would never see
      # the new file. Directory mounts re-resolve the inode on every
      # open(), so the symlink-via-directory walk picks up the live
      # file every time.
      GUACAMOLE_HOME: /etc/guacamole
      GUACD_HOSTNAME: guacd
      GUACD_PORT: '4822'
      # PostgreSQL JDBC auth (bundled in the image; enabled by these vars).
      # This backend enforces the per-connection concurrency limit
      # (max_connections / max_connections_per_user = 1) that the
      # control-plane sets on every lab connection, so a duplicate/refresh
      # open is rejected instead of kicking the live RDP session. The
      # file-based user-mapping.xml mount below is kept as a transitional
      # fallback; both auth providers load side by side.
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: 'false'
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Background symlink installer. Polls forever (no early-exit
        # timeout) because the previous 60s budget raced on cold starts
        # — start.sh can take longer than that to wipe ~/.guacamole and
        # populate guacamole.properties under load. Once the runtime
        # dir exists we install the symlink and re-install it on a
        # short cadence so a future start.sh re-run can't shadow it
        # with a regular file copy. The control-plane is the single
        # writer of /etc/guacamole/user-mapping.xml; the symlink keeps
        # Guacamole's mtime poll pointed at the live file forever.
        (
          while true; do
            if [ -d /home/guacamole/.guacamole ]; then
              ln -sfn /etc/guacamole/user-mapping.xml \
                      /home/guacamole/.guacamole/user-mapping.xml
            fi
            sleep 5
          done
        ) &
        exec /opt/guacamole/bin/start.sh
    volumes:
      # Directory mount. Used by start.sh as the GUACAMOLE_HOME template
      # AND as the live source for the symlinked user-mapping.xml. Must
      # be a directory mount (not single-file) so atomic-rename writes
      # by the control-plane are visible.
      - ./guacamole:/etc/guacamole:ro
    networks:
      - default

  control-plane:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      # connection_limit raised from the Prisma default (cpus*2+1 = 13) because
      # the wildcard lab proxy resolves the subdomain->instance on every asset
      # request; under real cohort load a 13-conn pool saturates and Prisma
      # throws P2024 "Timed out fetching a connection". Postgres max_connections
      # is 100; we keep well under it (control-plane 40 + guac JDBC pool 4).
      DATABASE_URL: postgresql://labforge:${POSTGRES_PASSWORD:-labforge}@postgres:5432/labforge?schema=public&connection_limit=40&pool_timeout=20
      REDIS_URL: redis://redis:6379
      # Guacamole JDBC auth DB — control-plane provisions per-instance users +
      # connections (with concurrency limit = 1) directly into this DB.
      GUACAMOLE_DB_URL: postgresql://guacamole:${GUAC_DB_PASSWORD}@postgres:5432/guacamole_db
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: ${JWT_ISSUER:-labforge}
      JWT_LAUNCH_TTL_SECONDS: ${JWT_LAUNCH_TTL_SECONDS:-60}
      JWT_SESSION_TTL_SECONDS: 14400
      # Public addressing — must match the Cloudflare DNS records above.
      PUBLIC_API_URL: https://api.environments.learnlytica.com
      PUBLIC_LAB_DOMAIN: lab.environments.learnlytica.com
      PUBLIC_GATEWAY_URL: https://lab.environments.learnlytica.com
      RUNTIME: docker
      DOCKER_HOST_SOCKET: /var/run/docker.sock
      DOCKER_NETWORK: labforge_labnet
      LAB_DEFAULT_CPU: 1
      LAB_DEFAULT_MEMORY_MB: 1024
      # Long-running labs (up to ~1 year). Idle/suspend reaping disabled so
      # student sessions never go away on them; expiry-based reaping still
      # runs on each launch's individual `expiresAt`.
      LAB_IDLE_TIMEOUT_MINUTES: 525600
      LAB_MAX_DURATION_MINUTES: 525600
      LAB_SUSPEND_IDLE_MINUTES: 525600
      LAB_HARD_INACTIVITY_DAYS: 365
      LAB_ALLOW_PRIVILEGED: 'true'
      PREWARM_ENABLED: 'true'
      PREWARM_INTERVAL_SECONDS: 15
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-Learnlytica}
      SEED_TENANT_API_KEY: ${SEED_TENANT_API_KEY}
    volumes:
      # Host docker socket — control plane spins up sibling lab containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH key used to reach remote worker nodes (Platform → Nodes).
      # Generate once on the primary with:
      #   ssh-keygen -t ed25519 -f deploy/secrets/nodes_id_ed25519 -N ""
      - ./secrets/nodes_id_ed25519:/root/.ssh/nodes_id_ed25519:ro
      # Shared with the guacamole container; control-plane writes
      # user-mapping.xml here on every guacamole-rdp instance lifecycle
      # change. Same on-disk path on both sides keeps GuacamoleConfig.
      # userMappingPath simple.
      - ./guacamole:/etc/guacamole:rw
    networks:
      - default
      - labnet
    command: >
      sh -c "pnpm --filter @labforge/control-plane exec prisma db push --schema=prisma/schema.prisma --accept-data-loss &&
             pnpm --filter @labforge/control-plane exec tsx prisma/seed.ts &&
             node dist/server.js"

  admin-ui:
    build:
      context: ..
      dockerfile: packages/admin-ui/Dockerfile
    restart: unless-stopped
    # Hard memory cap. Kills + restarts the container if it leaks past this
    # instead of letting it consume the whole host (we've seen it grow to
    # 28 GB in ~4 days under traffic — there's an SSR error path that leaks
    # request handles after "Cannot write headers after they are sent").
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      NODE_ENV: production
      LABFORGE_API_URL: http://control-plane:4000
      # Cap V8 heap so Node OOMs cleanly + restart kicks in before host swap.
      NODE_OPTIONS: "--max-old-space-size=1536"
    depends_on:
      - control-plane
    networks:
      - default

networks:
  default:
    driver: bridge
  labnet:
    name: labforge_labnet
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
