<!doctype html>
<html>
<head><meta charset="utf-8"><title>iframe keyboard test</title>
<style>html,body{margin:0;height:100%}#f{width:100%;height:100vh;border:0}</style>
</head>
<body>
<iframe id="f" src="REPLACE_URL"
  allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
  // Mirror the admin LabFrame behaviour we are about to ship: focus the
  // frame on load and whenever the pointer enters, so keystrokes route into
  // the embedded Guacamole client instead of the parent document.
  const f = document.getElementById('f');
  f.addEventListener('load', () => { try { f.focus(); } catch (e) {} });
  window.addEventListener('mouseenter', () => { try { f.focus(); } catch (e) {} }, true);
</script>
</body>
</html>
